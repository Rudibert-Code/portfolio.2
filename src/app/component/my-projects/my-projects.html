<section class="special-section" id="#my-projetcs">
    <h2 class="color_primary">My projects</h2>
    <div class="max-size_v">
        <div class="position-lables" id="projects"> 
            @for (projects of myProjects; track $index) {
                <p class="btn shape_lable" (click)="getProjectDetails(projects)" id="pro{{ projects.number }}"> {{ projects.number }}. Project</p>
            }  
        </div>
        <div class="shape_bg column" id="project-bg">
            <div class="project-techlist">
                <h2 class="color_primary">  {{ currentProject[0].name }} </h2>
                <div class="row only_mobile">
                    <p class="small-font">Technologies: </p><p class="small-font" id="project-techlist"> {{ currentProject[0].tech }} </p>
                </div>
                <div class="row only_mobile">
                    <p class="small-font">Duration: </p><p class="small-font" id="project-duration"> {{ currentProject[0].duration }} </p>
                </div>
            </div>
            <img class="project-img" src=" {{ currentProject[0].img }} " alt="" id="pjroject-img">
            <div id="project-descriptions"></div>
            <div class="row" [style.gap.px]="32">
                <a class="button-base-alt size_button" (click)="openWindow( currentProject[0].link  )" href="" target="_blank" id="live-test">Live test</a>
                <a class="button-base size_button" (click)="openWindow( currentProject[0].git )" href="" target="_blank" id="live-github">GitHub</a>
            </div>
        </div>
    </div>
    {{ firstMark() }}
</section>
